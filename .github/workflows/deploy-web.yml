# Publica el sitio de AROMATIC (carpeta web/) en GitHub Pages:
#   https://<usuario>.github.io/<repositorio>/
#
# - En cada pull request que toque web/ solo compila y verifica (sin publicar).
# - Al llegar cambios a main, compila y publica.
# - También se puede lanzar a mano: pestaña Actions → "Publicar sitio web" → Run workflow.
#
# Número de WhatsApp: Settings → Secrets and variables → Actions → Variables →
# New repository variable → WHATSAPP_NUMBER (solo dígitos, p. ej. 504XXXXXXXX).

name: Publicar sitio web

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy-web.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Verificar código
        run: npm run lint && npm run typecheck

      - name: Compilar sitio estático
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ vars.WHATSAPP_NUMBER }}

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: web/out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
